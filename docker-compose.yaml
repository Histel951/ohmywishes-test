services:
  php:
    build:
      context: ./docker/php
    container_name: wishlist_php
    working_dir: /var/www/html
    volumes:
      - ./symfony:/var/www/html
    networks:
      - wishlist

  nginx:
    image: nginx:1.27-alpine
    container_name: wishlist_nginx
    ports:
      - "8080:80"
    volumes:
      - ./symfony:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - wishlist

  postgres:
    image: postgres:16-alpine
    container_name: wishlist_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wishlist}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-wishlist}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wishlist

volumes:
  postgres_data:

networks:
  wishlist:
    driver: bridge